name: real-repos

# slow: clones pinned rich, httpx, click and flask; run by hand from the Actions tab
on:
  workflow_dispatch:

jobs:
  real-repos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install poetry
      - run: poetry install --with dev
      - run: ACTE_REAL_REPOS=1 poetry run pytest -q tests/test_real_repos.py
