[project]
name = "acte"
version = "0.1.0"
description = "ACTE is an AI agent architecture using MCP that translates complex Python repositories into deterministic RDF Knowledge Graphs."
authors = [
    {name = "Dhruvesh Malhotra",email = "dhruveshmalhotra186@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "tree-sitter-language-pack (>=1.8.1,<2.0.0)",
    "rdflib (>=7.6.0,<8.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "acte", from = "src" }
]
[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "griffe (>=2.3.2,<3.0.0)"
]

[tool.ruff]
# vendored third-party benchmark code, kept unmodified
extend-exclude = ["tests/data"]

[tool.ruff.lint.per-file-ignores]
# getattr fallbacks are the deliberate tree-sitter API-drift defence (see CLAUDE.md)
"src/acte/parser.py" = ["B009"]
